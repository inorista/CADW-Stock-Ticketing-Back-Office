name: Test automation

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      execution:
        description: Execution target
        required: true
        default: local
        type: choice
        options: [local, lambdatest]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    outputs:
      test_outcome: ${{ steps.tests.outcome }}
    env:
      LT_USERNAME: ${{ secrets.LT_USERNAME }}
      LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
      LT_BUILD: GitHub-${{ github.run_number }}-${{ github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Chrome, Firefox, and Edge tests
        id: tests
        continue-on-error: true
        run: >-
          mvn -B -ntp clean test
          "-DsuiteXmlFile=src/test/resources/suites/cross-browser.xml"
          "-Dexecution=${{ inputs.execution || 'local' }}"

      - name: Generate Allure HTML
        if: always()
        continue-on-error: true
        run: mvn -B -ntp allure:report

      - name: Assemble report website
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force public/allure, public/extent | Out-Null
          if (Test-Path target/site/allure-maven-plugin) {
            Copy-Item target/site/allure-maven-plugin/* public/allure -Recurse -Force
          } else {
            Set-Content public/allure/index.html '<h1>Allure report was not generated</h1>'
          }
          if (Test-Path target/extent-report) {
            Copy-Item target/extent-report/* public/extent -Recurse -Force
          } else {
            Set-Content public/extent/index.html '<h1>Extent report was not generated</h1>'
          }
          Copy-Item src/test/resources/report-index.html public/index.html

      - name: Upload raw test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-reports-${{ github.run_number }}
          path: |
            target/allure-results
            target/extent-report
            target/cucumber-report
            target/surefire-reports
            target/logs
          if-no-files-found: warn
          retention-days: 14

      - name: Configure GitHub Pages
        if: always() && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload report website
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Enforce test result on pull requests
        if: github.event_name == 'pull_request' && steps.tests.outcome == 'failure'
        shell: bash
        run: exit 1

  deploy-reports:
    if: github.event_name != 'pull_request'
    needs: build-and-test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reports to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Add report links to workflow summary
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          TEST_OUTCOME: ${{ needs.build-and-test.outputs.test_outcome }}
        run: |
          echo "## Test reports" >> "$GITHUB_STEP_SUMMARY"
          echo "- [Allure report](${PAGE_URL}allure/)" >> "$GITHUB_STEP_SUMMARY"
          echo "- [Extent report](${PAGE_URL}extent/)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Test step outcome: **${TEST_OUTCOME}**" >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve failing test status
        if: needs.build-and-test.outputs.test_outcome == 'failure'
        run: exit 1
