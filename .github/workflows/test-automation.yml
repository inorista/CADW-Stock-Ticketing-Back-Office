name: Test automation

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '0 0 * * *'
      timezone: Asia/Ho_Chi_Minh
    - cron: '0 8 * * *'
      timezone: Asia/Ho_Chi_Minh
  workflow_dispatch:
    inputs:
      suite:
        description: Cucumber execution suite
        required: true
        default: cucumber
        type: choice
        options:
          - cucumber
          - cucumber-cross-browser
      test_scope:
        description: Cucumber test scope
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - e2e
          - regression
      environment:
        description: Application environment
        required: true
        default: dev
        type: choice
        options: [dev, staging, prod]
      browser:
        description: Browser for single-browser suites
        required: true
        default: chrome
        type: choice
        options: [chrome, firefox, edge]
      headless:
        description: Run browser without a visible window
        required: true
        default: true
        type: boolean
      execution:
        description: Execution target
        required: true
        default: local
        type: choice
        options: [local, lambdatest]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    outputs:
      test_outcome: ${{ steps.tests.outcome }}
      run_kind: ${{ steps.parameters.outputs.run_kind }}
      pages_ready: ${{ steps.pages-artifact.outcome == 'success' }}
    env:
      AUTH_USERNAME: ${{ secrets.AUTH_USERNAME }}
      AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}
      LT_USERNAME: ${{ secrets.LT_USERNAME }}
      LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
      LT_BUILD: GitHub-${{ github.run_number }}-${{ github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Resolve execution parameters
        id: parameters
        shell: pwsh
        env:
          INPUT_SUITE: ${{ inputs.suite }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_BROWSER: ${{ inputs.browser }}
          INPUT_HEADLESS: ${{ inputs.headless }}
          INPUT_EXECUTION: ${{ inputs.execution }}
          INPUT_TEST_SCOPE: ${{ inputs.test_scope }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
          SCHEDULED_TEST_ENVIRONMENT: ${{ vars.SCHEDULED_TEST_ENVIRONMENT }}
        run: |
          $suite = $env:INPUT_SUITE
          if ([string]::IsNullOrWhiteSpace($suite)) { $suite = 'cucumber' }
          $suiteFiles = @{
            'cucumber' = 'src/test/resources/suites/cucumber-testng.xml'
            'cucumber-cross-browser' = 'src/test/resources/suites/cross-browser.xml'
          }
          if (-not $suiteFiles.ContainsKey($suite)) { throw "Unsupported suite: $suite" }

          $environment = $env:INPUT_ENVIRONMENT
          if ([string]::IsNullOrWhiteSpace($environment)) { $environment = 'dev' }
          $browser = $env:INPUT_BROWSER
          if ([string]::IsNullOrWhiteSpace($browser)) { $browser = 'chrome' }
          $headless = $env:INPUT_HEADLESS
          if ([string]::IsNullOrWhiteSpace($headless)) { $headless = 'true' }
          $execution = $env:INPUT_EXECUTION
          if ([string]::IsNullOrWhiteSpace($execution)) { $execution = 'local' }
          $scope = $env:INPUT_TEST_SCOPE
          if ([string]::IsNullOrWhiteSpace($scope)) { $scope = 'smoke' }

          switch ($scope) {
            'smoke' { $tags = '@smoke and not @mutation' }
            'e2e' { $tags = '@e2e' }
            'regression' { $tags = '@regression' }
            default { throw "Unsupported Cucumber test scope: $scope" }
          }

          $runKind = "Cucumber $scope"
          $runSlug = "cucumber-$scope"
          if ($env:GITHUB_EVENT_NAME -eq 'schedule') {
            $environment = $env:SCHEDULED_TEST_ENVIRONMENT
            if ([string]::IsNullOrWhiteSpace($environment)) { $environment = 'staging' }
            $browser = 'chrome'
            $headless = 'true'
            $execution = 'local'

            switch ($env:SCHEDULE_CRON) {
              '0 0 * * *' {
                $suite = 'cucumber'
                $scope = 'e2e'
                $tags = '@e2e'
                $runKind = 'Nightly E2E'
                $runSlug = 'nightly-e2e'
              }
              '0 8 * * *' {
                $suite = 'cucumber'
                $scope = 'smoke'
                $tags = '@smoke and not @mutation'
                $runKind = 'Morning Smoke'
                $runSlug = 'morning-smoke'
              }
              default { throw "Unsupported scheduled trigger: $env:SCHEDULE_CRON" }
            }
          }

          "TEST_SUITE_FILE=$($suiteFiles[$suite])" >> $env:GITHUB_ENV
          "TEST_ENVIRONMENT_INPUT=$environment" >> $env:GITHUB_ENV
          "TEST_BROWSER=$browser" >> $env:GITHUB_ENV
          "TEST_HEADLESS=$headless" >> $env:GITHUB_ENV
          "TEST_EXECUTION=$execution" >> $env:GITHUB_ENV
          "TEST_SCOPE=$scope" >> $env:GITHUB_ENV
          "TEST_CUCUMBER_TAGS=$tags" >> $env:GITHUB_ENV
          "TEST_RUN_KIND=$runKind" >> $env:GITHUB_ENV
          "run_kind=$runKind" >> $env:GITHUB_OUTPUT
          "run_slug=$runSlug" >> $env:GITHUB_OUTPUT

          "## Execution plan" >> $env:GITHUB_STEP_SUMMARY
          "- Run: **$runKind**" >> $env:GITHUB_STEP_SUMMARY
          "- Suite: ``$suite``" >> $env:GITHUB_STEP_SUMMARY
          "- Scope: ``$scope``" >> $env:GITHUB_STEP_SUMMARY
          "- Environment: ``$environment``" >> $env:GITHUB_STEP_SUMMARY
          "- Browser: ``$browser``; headless: ``$headless``" >> $env:GITHUB_STEP_SUMMARY
          "- Cucumber tags: ``$tags``" >> $env:GITHUB_STEP_SUMMARY

      - name: Materialize environment configuration
        shell: pwsh
        env:
          TEST_CONFIG_DEV: ${{ secrets.TEST_CONFIG_DEV }}
          TEST_CONFIG_STAGING: ${{ secrets.TEST_CONFIG_STAGING }}
          TEST_CONFIG_PROD: ${{ secrets.TEST_CONFIG_PROD }}
        run: |
          $configs = @{
            'dev' = $env:TEST_CONFIG_DEV
            'staging' = $env:TEST_CONFIG_STAGING
            'prod' = $env:TEST_CONFIG_PROD
          }
          $configDirectory = Join-Path $env:GITHUB_WORKSPACE 'src/main/java/com/cadw/automation/config'
          New-Item -ItemType Directory -Force $configDirectory | Out-Null

          foreach ($environmentName in $configs.Keys) {
            $content = $configs[$environmentName]
            if ([string]::IsNullOrWhiteSpace($content)) {
              throw "Missing GitHub Actions secret: TEST_CONFIG_$($environmentName.ToUpper())"
            }
            $configPath = Join-Path $configDirectory "$environmentName.config"
            [System.IO.File]::WriteAllText(
              $configPath,
              $content.Trim() + [System.Environment]::NewLine,
              [System.Text.UTF8Encoding]::new($false))
          }
          Write-Host 'Environment configuration files created from GitHub Actions secrets.'

      - name: Run selected tests
        id: tests
        continue-on-error: true
        shell: pwsh
        run: |
          mvn -B -ntp clean test `
            "-DsuiteXmlFile=$env:TEST_SUITE_FILE" `
            "-Dtest.environment=$env:TEST_ENVIRONMENT_INPUT" `
            "-Dwebdriver.browser=$env:TEST_BROWSER" `
            "-Dwebdriver.headless=$env:TEST_HEADLESS" `
            "-Dexecution=$env:TEST_EXECUTION" `
            "-Dcucumber.filter.tags=$env:TEST_CUCUMBER_TAGS"

      - name: Generate Allure HTML
        if: always()
        continue-on-error: true
        run: mvn -B -ntp allure:report

      - name: Assemble report website
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force public/allure, public/extent, public/testng, public/cucumber | Out-Null
          if (Test-Path target/site/allure-maven-plugin) {
            Copy-Item target/site/allure-maven-plugin/* public/allure -Recurse -Force
          } else {
            Set-Content public/allure/index.html '<h1>Allure report was not generated</h1>'
          }
          if (Test-Path target/extent-report) {
            Copy-Item target/extent-report/* public/extent -Recurse -Force
          } else {
            Set-Content public/extent/index.html '<h1>Extent report was not generated</h1>'
          }
          if (Test-Path target/surefire-reports/index.html) {
            Copy-Item target/surefire-reports/* public/testng -Recurse -Force
          } else {
            Set-Content public/testng/index.html '<h1>Cucumber TestNG runner report was not generated</h1>'
          }
          if (Test-Path target/cucumber-report/cucumber.html) {
            Copy-Item target/cucumber-report/cucumber.html public/cucumber/index.html -Force
            if (Test-Path target/cucumber-report/cucumber.json) {
              Copy-Item target/cucumber-report/cucumber.json public/cucumber/cucumber.json -Force
            }
          } else {
            Set-Content public/cucumber/index.html '<h1>Cucumber report was not generated for this TestNG run</h1>'
          }
          Copy-Item src/test/resources/report-index.html public/index.html

      - name: Upload raw test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: automation-reports-${{ steps.parameters.outputs.run_slug }}-${{ github.run_number }}
          path: |
            target/allure-results
            target/extent-report
            target/cucumber-report
            target/surefire-reports
            target/logs
            public
          if-no-files-found: warn
          retention-days: 14

      - name: Configure GitHub Pages
        id: pages-config
        if: always() && github.event_name != 'pull_request' && vars.PUBLISH_GITHUB_PAGES == 'true'
        continue-on-error: true
        uses: actions/configure-pages@v6

      - name: Upload report website
        id: pages-artifact
        if: always() && steps.pages-config.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Summarize and enforce test result
        if: always()
        shell: pwsh
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          PAGES_REQUESTED: ${{ vars.PUBLISH_GITHUB_PAGES }}
          PAGES_CONFIG_OUTCOME: ${{ steps.pages-config.outcome }}
        run: |
          "## Final status" >> $env:GITHUB_STEP_SUMMARY
          "- Maven/Cucumber: **$env:TEST_OUTCOME**" >> $env:GITHUB_STEP_SUMMARY
          if ($env:PAGES_REQUESTED -eq 'true') {
            "- GitHub Pages configuration: **$env:PAGES_CONFIG_OUTCOME**" >> $env:GITHUB_STEP_SUMMARY
          } else {
            "- GitHub Pages: **disabled**; reports remain available as an Actions artifact" >> $env:GITHUB_STEP_SUMMARY
          }

          if ($env:TEST_OUTCOME -eq 'failure') {
            Write-Host '::error title=Cucumber tests failed::Open the Run selected tests step or download the automation-reports artifact for the actual scenario failure.'
            exit 1
          }

  deploy-reports:
    if: always() && needs.build-and-test.outputs.pages_ready == 'true'
    needs: build-and-test
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reports to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Add report links to workflow summary
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          TEST_OUTCOME: ${{ needs.build-and-test.outputs.test_outcome }}
          RUN_KIND: ${{ needs.build-and-test.outputs.run_kind }}
        run: |
          echo "## Test reports" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run: **${RUN_KIND}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- [Allure report](${PAGE_URL}allure/)" >> "$GITHUB_STEP_SUMMARY"
          echo "- [Extent report](${PAGE_URL}extent/)" >> "$GITHUB_STEP_SUMMARY"
          echo "- [Cucumber runner report](${PAGE_URL}testng/)" >> "$GITHUB_STEP_SUMMARY"
          echo "- [Cucumber report](${PAGE_URL}cucumber/)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Test step outcome: **${TEST_OUTCOME}**" >> "$GITHUB_STEP_SUMMARY"
